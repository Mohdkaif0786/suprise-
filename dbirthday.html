<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinesh Sir Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:black;
    height:100vh;
}

/* Background */

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#ff0080 0%,transparent 30%),
    radial-gradient(circle at bottom right,#00d9ff 0%,transparent 30%),
    radial-gradient(circle at center,#220044 0%,#000 70%);
    animation:bg 8s infinite alternate;
}

@keyframes bg{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

/* Surprise Screen */

.surprise{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
    transition:1s;
}

.surprise.hide{
    opacity:0;
    pointer-events:none;
}

/* Image */

.surprise-img{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    box-shadow:
    0 0 30px #ff00aa,
    0 0 60px #00e1ff;
    animation:photoGlow 2s infinite alternate;
}

@keyframes photoGlow{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

/* Surprise Text */

.surprise h1{
    margin-top:25px;
    color:white;
    font-size:clamp(35px,8vw,80px);
    text-align:center;
    font-weight:900;
    background:linear-gradient(90deg,#fff,#ff00aa,#00f2ff,#ffe600);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:textGlow 4s linear infinite;
}

@keyframes textGlow{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

.surprise p{
    color:#ddd;
    margin-top:15px;
    font-size:clamp(15px,3vw,24px);
    text-align:center;
}

.enter-btn{
    margin-top:35px;
    padding:16px 40px;
    border:none;
    border-radius:60px;
    cursor:pointer;
    color:white;
    font-size:20px;
    font-weight:700;
    background:linear-gradient(45deg,#ff0080,#ffcc00,#00e1ff);
    background-size:300%;
    animation:btnMove 4s linear infinite;
    box-shadow:0 0 30px rgba(255,255,255,.4);
    transition:.4s;
}

.enter-btn:hover{
    transform:scale(1.08);
}

@keyframes btnMove{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

/* Main Design */

.main{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* Card */

.card{
    width:min(92%,900px);
    padding:clamp(20px,4vw,50px);
    border-radius:35px;
    text-align:center;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 40px rgba(255,255,255,.2);
    color:white;
    animation:cardGlow 4s infinite alternate;
}

@keyframes cardGlow{
    from{
        box-shadow:0 0 20px #ff00aa;
    }
    to{
        box-shadow:0 0 60px #00e1ff;
    }
}

/* Main Photo */

.main-photo{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    box-shadow:
    0 0 30px #ff00aa,
    0 0 60px #00e1ff;
    animation:rotateGlow 5s linear infinite;
}

@keyframes rotateGlow{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}

.title{
    margin-top:20px;
    font-size:clamp(25px,6vw,60px);
    font-weight:900;
    background:linear-gradient(90deg,#fff,#ff00aa,#00f2ff,#ffe600);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleAnim 5s linear infinite;
}

@keyframes titleAnim{
    0%{
        background-position:0%;
    }
    100%{
        background-position:300%;
    }
}

.message{
    margin-top:25px;
    font-size:clamp(15px,2vw,24px);
    line-height:1.8;
    color:#eee;
}

.dua{
    margin-top:25px;
    font-size:clamp(16px,2vw,24px);
    color:#00ffcc;
    font-weight:700;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

/* Hearts */

.heart{
    position:absolute;
    color:#ff4d6d;
    animation:heartFloat linear forwards;
}

@keyframes heartFloat{
    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

/* Fireworks */

.firework{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    animation:explode 1s ease-out forwards;
}

@keyframes explode{
    from{
        transform:scale(1);
        opacity:1;
    }
    to{
        transform:scale(30);
        opacity:0;
    }
}

/* Responsive */

@media(max-width:600px){

    .surprise-img,
    .main-photo{
        width:150px;
        height:150px;
    }

    .enter-btn{
        width:90%;
    }

}

</style>
</head>
<body>

<div class="bg"></div>

<!-- Surprise Screen -->

<div class="surprise" id="surprise">

    <!-- YOUR PHOTO -->
    <img src="dinesh.jpg" class="surprise-img">

    <h1>🎂 SPECIAL SURPRISE 🎂</h1>

    <p>
        For The Legendary Dinesh Sir ✨
    </p>

    <button class="enter-btn" onclick="openSurprise()">
        🎉 Open Surprise 🎉
    </button>

</div>

<!-- Main Design -->

<div class="main">

    <div class="card">

        <img src="https://picsum.photos/200" class="main-photo">

        <div class="title">
            Happy Birthday <br>
            Dinesh Sir
        </div>

        <div class="message">
            Sir, aap sirf ek insaan nahi...
            ek inspiration ho ✨ <br><br>

            Aapki life hamesha success,
            happiness aur positivity se bhari rahe ❤️
        </div>

        <div class="dua">
            🤲 Allah aapko sehat,
            lambi umar aur endless happiness de ✨
        </div>

    </div>

</div>

<script>

/* Open Surprise */

function openSurprise(){

    document
    .getElementById("surprise")
    .classList.add("hide");

    celebrate();
}

/* Hearts */

function createHeart(){

    let heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=
    (Math.random()*25+15)+"px";

    heart.style.animationDuration=
    (Math.random()*4+4)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,300);

/* Fireworks */

function celebrate(){

    for(let i=0;i<70;i++){

        setTimeout(()=>{

            let firework=
            document.createElement("div");

            firework.classList.add("firework");

            firework.style.left=
            Math.random()*100+"vw";

            firework.style.top=
            Math.random()*100+"vh";

            firework.style.background=
            `hsl(${Math.random()*360},100%,60%)`;

            document.body.appendChild(firework);

            setTimeout(()=>{
                firework.remove();
            },1000);

        },i*70);
    }
}

</script>

</body>
</html>
